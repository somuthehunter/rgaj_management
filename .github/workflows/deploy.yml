name: Deploy rgaj_management to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ratna-fr   # must match your GitHub environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Go to project folder
            cd /var/www/rgaj_management

            # Pull latest code
            git pull origin master

            # Install dependencies (uncomment based on your stack)

            # Node.js
            if [ -f package.json ]; then
              npm install
              npm run build || true
              pm2 restart all || true
            fi

            # Python
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
              sudo systemctl restart rgaj_management || true
            fi

            # Docker
            if [ -f docker-compose.yml ]; then
              docker-compose down
              docker-compose up -d --build
            fi