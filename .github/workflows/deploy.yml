name: Deploy rgaj_management to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ratna-fr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # Navigate to project directory
            cd /var/www/rgaj_management

            # Pull latest code
            git pull origin master

            # Install pnpm if not installed
            if ! command -v pnpm &> /dev/null; then
              npm install -g pnpm
            fi

            # Install dependencies
            pnpm install --frozen-lockfile

            # Write .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env

            # Build the Next.js app
            pnpm run build

            # Restart app with PM2 (creates if not exists)
            pm2 describe rgaj_management > /dev/null 2>&1 \
              && pm2 restart rgaj_management \
              || pm2 start npm --name "rgaj_management" -- start

            # Save PM2 process list so it survives reboots
            pm2 save