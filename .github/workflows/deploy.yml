name: Deploy rgaj_management to VPS

on:
push:
branches:
- master
workflow_dispatch:

jobs:
deploy:
runs-on: ubuntu-latest
environment: ratna-fr

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Deploy to VPS via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.VPS_HOST }}
      username: ${{ secrets.VPS_USER }}
      key: ${{ secrets.VPS_SSH_KEY }}
      port: ${{ secrets.VPS_PORT }}
      script: |
        set -e

        source ~/.bashrc || true
        source ~/.profile || true
        export PATH=/usr/bin:/usr/local/bin:$PATH

        cd /var/www/rgaj_management

        git fetch origin
        git reset --hard origin/master
        git clean -fd

        npm install

        cat > .env << 'EOF'
        ${{ secrets.ENV_FILE }}
        EOF

        npm run build

        pm2 describe rgaj_mg_frontend > /dev/null 2>&1 \
          && pm2 restart rgaj_mg_frontend \
          || pm2 start npm --name "rgaj_mg_frontend" -- start

        pm2 save
```
